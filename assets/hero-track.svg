<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300">
  <defs>
    <filter id="hCard" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#3A4A3C" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="hFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FBF92" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8FBF92" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hGauge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D98C7D"/>
      <stop offset="0.5" stop-color="#E0B255"/>
      <stop offset="1" stop-color="#6E9E80"/>
    </linearGradient>
    <clipPath id="hcClip"><rect x="18" y="66" width="196" height="150" rx="18"/></clipPath>
  </defs>

  <!-- ===== background trend ===== -->
  <path d="M8 92 C48 80 70 108 104 92 C140 74 168 100 206 66 C246 30 284 58 332 30"
        fill="none" stroke="#BFD9BC" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M8 116 C52 108 78 124 116 112 C156 100 188 118 224 94 C262 70 296 84 332 62"
        fill="none" stroke="#6E9E80" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  <!-- dashed marker line + dot -->
  <line x1="70" y1="150" x2="300" y2="150" stroke="#C9D3CB" stroke-width="2" stroke-dasharray="3 5"/>
  <circle cx="238" cy="96" r="7" fill="#fff" stroke="#4E7FA8" stroke-width="3"/>

  <!-- ===== main card: Recovery Health ===== -->
  <g filter="url(#hCard)">
    <rect x="18" y="66" width="196" height="150" rx="18" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#hcClip)">
    <!-- header -->
    <circle cx="44" cy="92" r="14" fill="#E3EFE4"/>
    <path d="M44 98 c-8 -6 -11 -12 -6 -16 c3 -2 5 0 6 2 c1 -2 3 -4 6 -2 c5 4 2 10 -6 16 z" fill="#5E8B6E"/>
    <text x="66" y="88" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="800" fill="#2E3238">Recovery Health</text>
    <text x="66" y="103" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#8A8F94">Today · on track</text>
    <circle cx="196" cy="86" r="1.7" fill="#B7BDB8"/><circle cx="203" cy="86" r="1.7" fill="#B7BDB8"/><circle cx="190" cy="86" r="1.7" fill="#B7BDB8"/>
    <!-- score -->
    <text x="34" y="150" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="800" fill="#2E3238">73</text>
    <text x="96" y="140" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="800" fill="#5E8B6E">↗ +2</text>
    <!-- status pills -->
    <g font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700">
      <rect x="34" y="158" width="86" height="22" rx="11" fill="#E7F1E7"/>
      <text x="46" y="173" fill="#4E7A50">Above average</text>
      <rect x="126" y="158" width="56" height="22" rx="11" fill="#EEF0F0"/>
      <text x="137" y="173" fill="#7C8388">Stable</text>
    </g>
    <!-- mini progress -->
    <rect x="34" y="192" width="148" height="8" rx="4" fill="#ECEFEC"/>
    <rect x="34" y="192" width="112" height="8" rx="4" fill="#6E9E80"/>
    <text x="34" y="214" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#8A8F94">47-day streak · 12 check-ins</text>
  </g>

  <!-- ===== gauge card: overlapping ===== -->
  <g filter="url(#hCard)">
    <rect x="196" y="150" width="132" height="128" rx="18" fill="#FFFFFF"/>
  </g>
  <!-- header -->
  <circle cx="220" cy="176" r="13" fill="#F3EFDF"/>
  <path d="M220 182 c-7 -5 -9 -11 -5 -14 c3 -2 4 0 5 1 c1 -1 2 -3 5 -1 c4 3 2 9 -5 14 z" fill="#C9962E"/>
  <g>
    <rect x="284" y="166" width="34" height="20" rx="10" fill="#E7F1E7"/>
    <text x="292" y="180" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="800" fill="#4E7A50">↗ 5</text>
  </g>
  <text x="242" y="176" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="800" fill="#2E3238">Recovery</text>
  <text x="242" y="189" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="9" fill="#8A8F94">This week</text>
  <!-- semicircle gauge -->
  <g transform="translate(262 244)">
    <path d="M-42 0 A42 42 0 0 1 42 0" fill="none" stroke="#ECEFEC" stroke-width="11" stroke-linecap="round"/>
    <path d="M-42 0 A42 42 0 0 1 30 -29" fill="none" stroke="url(#hGauge)" stroke-width="11" stroke-linecap="round"/>
    <!-- needle to ~73% -->
    <g transform="rotate(48)"><line x1="0" y1="0" x2="0" y2="-38" stroke="#2E3238" stroke-width="3" stroke-linecap="round"/></g>
    <circle cx="0" cy="0" r="4.5" fill="#2E3238"/>
  </g>
  <text x="262" y="256" text-anchor="middle" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="800" fill="#2E3238">73</text>
  <text x="262" y="270" text-anchor="middle" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="9" fill="#8A8F94">Above average</text>
</svg>
