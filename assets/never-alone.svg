<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="naHeart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E08C7D"/>
      <stop offset="1" stop-color="#C56A5E"/>
    </linearGradient>
  </defs>

  <!-- soft ground -->
  <ellipse cx="60" cy="98" rx="42" ry="7" fill="#5E8B6E" opacity="0.10"/>

  <!-- back figure (sage) -->
  <g fill="#7FA980">
    <path d="M28 100 C28 78 40 70 52 70 C64 70 76 78 76 100 Z"/>
    <circle cx="52" cy="56" r="16"/>
  </g>
  <!-- front figure (blue), overlapping = togetherness -->
  <g fill="#6EA0CC">
    <path d="M50 102 C50 80 62 72 74 72 C86 72 98 80 98 102 Z"/>
    <circle cx="74" cy="58" r="16"/>
  </g>
  <!-- subtle rim so the two read apart -->
  <path d="M50 102 C50 80 62 72 74 72 C86 72 98 80 98 102" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.55"/>
  <circle cx="74" cy="58" r="16" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.55"/>

  <!-- heart above, connecting them -->
  <path d="M63 20 C63 13 53 12 53 21 C53 28 63 33 63 33 C63 33 73 28 73 21 C73 12 63 13 63 20 Z" fill="url(#naHeart)"/>

  <!-- delight sparkle -->
  <g fill="#E0B255">
    <path d="M96 40 C97 44 98 45 102 46 C98 47 97 48 96 52 C95 48 94 47 90 46 C94 45 95 44 96 40 Z"/>
    <circle cx="24" cy="44" r="2.4" opacity="0.8"/>
  </g>
</svg>
