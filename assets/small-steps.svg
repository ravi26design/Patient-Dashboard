<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <linearGradient id="ssBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F6F0"/><stop offset="1" stop-color="#F1F0EA"/>
    </linearGradient>
    <filter id="ssSh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3A4A3C" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="480" height="320" fill="url(#ssBg)"/>
  <!-- soft blobs -->
  <path d="M330 -20 C420 0 470 70 450 150 C540 120 540 -40 420 -50 Z" fill="#F3E7CB" opacity="0.55"/>
  <circle cx="70" cy="70" r="70" fill="#E3EFDE" opacity="0.7"/>
  <!-- plants -->
  <g fill="#8FBF92" opacity="0.9">
    <path d="M14 300 C4 260 18 232 40 224 C40 262 34 288 22 302 Z"/>
    <path d="M40 306 C40 266 56 244 78 240 C72 280 60 300 46 308 Z" fill="#A9CFA9"/>
  </g>
  <path d="M462 308 C472 268 458 240 436 234 C436 274 444 298 456 310 Z" fill="#8FBF92" opacity="0.9"/>

  <!-- ===== friendly character (coral hoodie) ===== -->
  <g>
    <path d="M78 320 C78 250 108 224 150 224 C192 224 222 250 222 320 Z" fill="#E68C85"/>
    <path d="M112 250 C112 272 188 272 188 250 L188 300 L112 300 Z" fill="#F0F2EE" opacity="0.35"/>
    <rect x="136" y="196" width="28" height="34" rx="12" fill="#EBC29E"/>
    <circle cx="150" cy="164" r="44" fill="#F1CBA9"/>
    <path d="M108 168 C104 118 150 104 176 120 C198 132 196 158 192 172 C188 150 180 140 168 138 C170 150 164 156 154 156 C150 150 150 146 150 142 C138 150 120 150 112 172 Z" fill="#4A3A2E"/>
    <circle cx="150" cy="112" r="14" fill="#4A3A2E"/>
    <circle cx="138" cy="166" r="3.4" fill="#3A2E26"/>
    <circle cx="164" cy="166" r="3.4" fill="#3A2E26"/>
    <path d="M144 178 C149 183 155 183 160 178" fill="none" stroke="#B96A5E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="130" cy="176" r="5" fill="#F0B0A6" opacity="0.6"/>
    <circle cx="172" cy="176" r="5" fill="#F0B0A6" opacity="0.6"/>
  </g>

  <!-- ===== floating daily-plan card ===== -->
  <g filter="url(#ssSh)"><rect x="250" y="66" width="200" height="150" rx="18" fill="#fff"/></g>
  <text x="272" y="96" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="800" fill="#2E3238">Today's plan</text>
  <text x="272" y="112" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#8A8F94">3 of 4 done</text>
  <!-- reward star -->
  <g transform="translate(418 96)"><path d="M0 -12 L3.4 -3.7 12 -3.7 5 1.8 7.6 10 0 5 -7.6 10 -5 1.8 -12 -3.7 -3.4 -3.7 Z" fill="#E0B255"/></g>
  <!-- check rows -->
  <g>
    <circle cx="284" cy="134" r="10" fill="#6E9E80"/><path d="M279 134 l3.5 3.5 6 -7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="302" y="129" width="118" height="10" rx="5" fill="#EAF1EA"/>
    <circle cx="284" cy="160" r="10" fill="#6E9E80"/><path d="M279 160 l3.5 3.5 6 -7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="302" y="155" width="96" height="10" rx="5" fill="#EAF1EA"/>
    <circle cx="284" cy="186" r="10" fill="#6E9E80"/><path d="M279 186 l3.5 3.5 6 -7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="302" y="181" width="108" height="10" rx="5" fill="#EAF1EA"/>
  </g>

  <!-- streak flame badge (floating at the card's lower-left) -->
  <g transform="translate(0 52)">
    <g filter="url(#ssSh)"><rect x="236" y="150" width="104" height="34" rx="17" fill="#fff"/></g>
    <path d="M255 158 c6 4 6 9 3 13 c5 0 9 -4 8 -11 c4 3 6 8 4 13 c-1 6 -7 9 -13 9 c-7 0 -12 -4 -12 -11 c0 -6 5 -9 8 -13 c-1 4 1 6 3 6 c1 -3 -1 -8 -2 -6 z" fill="#E58A5B"/>
    <text x="276" y="172" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="800" fill="#2E3238">47-day streak</text>
  </g>
</svg>
